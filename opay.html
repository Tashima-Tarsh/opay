<!DOCTYPE html>
<html>

<head>
	<title>Pay Now</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	<center>
		<div class="card">
			<div class="card-content">
				<a href=""><img src="img/logo.svg" height="50"></a>
				<br>
				<h4 style="color: #DAE0E2;">Pay Now</h4>
				<form id="opayform" onsubmit="return payNow(event);">
					<label style="color: #DAE1E2;">UPI ID (merchant):</label><br>
					<input type="text" class="text-box" value="nkumar906099-5@oksbi" readonly><br>
					<label style="color: #DAE1E2;">Enter Amount (INR):</label><br>
					<input type="number" name="am" class="text-box" placeholder="Enter amount" required><br>
					<button type="submit" class="btn" id="payBtn">Pay Now</button>
				</form>
				<div id="payErr" style="color:#c62828; margin-top:8px; display:none;"></div>
			</div>
		</div>
	</center>
	<script>
		async function payNow(event) {
			event.preventDefault();
			var btn = document.getElementById("payBtn");
			var err = document.getElementById("payErr");
			err.style.display = "none";
			err.textContent = "";
			btn.disabled = true;
			btn.textContent = "Creating...";

			var am = event.target.elements["am"].value;
			if (!am || isNaN(am) || Number(am) <= 0) {
				err.textContent = "Please enter a valid amount";
				err.style.display = "block";
				btn.disabled = false;
				btn.textContent = "Pay Now";
				return false;
			}

			var reference = "order_" + Date.now();
			var created = false;
			try {
				var res = await fetch("/api/v1/transactions", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						reference: reference,
						type: "credit",
						amount: Number(am),
						description: "UPI payment",
						upiId: "nkumar906099-5@oksbi",
					}),
				});
				if (!res.ok) {
					var txt = await res.text();
					throw new Error("Ledger create failed: " + res.status + " " + txt);
				}
				var data = await res.json();
				console.log("created transaction", data);
				created = true;
			} catch (e) {
				console.error("ledger create failed", e);
				err.textContent = e.message || "Could not create payment. Try again.";
				err.style.display = "block";
				btn.disabled = false;
				btn.textContent = "Pay Now";
				return false;
			}

			btn.textContent = "Redirecting...";
			location.href = "index.html?pa=nkumar906099-5@oksbi&am=" + encodeURIComponent(am)
				+ "&cu=INR&reference=" + encodeURIComponent(reference);
			return false;
		}
	</script>
</body>

</html>
