<!DOCTYPE html>
<html>

<head>
	<title>opay | Pay Now</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	<center>
		<div class="card">
			<div class="card-content">
				<a href="opay.html"><img src="img/logo.svg" height="50"></a>
				<h5 id="name" style="color: #101010;"></h5>
				<canvas id="qr"></canvas>
				<div style="margin-top: 2px;">
					<a id="opayIntent">
						<img src="img/upi.png" height="80">
						<br>
						<button class='btn'>Pay with UPI App</button>
					</a>
				</div>
				<br>
				<button class="btn" onclick="payNow()" style="background:#019031;">Pay Now (UPI Intent)</button>
				<br><br>
				<a href="opay.html" style="color: #777;">Back</a>
			</div>
		</div>
	</center>
	<script src="qrious/qrious.min.js"></script>
	<script>
		(function () {
			var qs = window.location.search;
			var params = new URLSearchParams(qs);
			var pa = params.get("pa") || "";
			var am = params.get("am") || "";
			var cu = params.get("cu") || "INR";
			var reference = params.get("reference") || "";

			if (!pa) {
				location.replace("opay.html");
				return;
			}

			var callback = window.location.protocol + "//" + window.location.hostname;
			if (window.location.port) callback += ":" + window.location.port;
			callback += "/callback?status=success&reference=" + encodeURIComponent(reference);

			var upiURL = "upi://pay" + qs
				+ "&refId=" + encodeURIComponent(reference)
				+ "&url=" + encodeURIComponent(callback);

			var label = "Scan QR or Pay using any UPI App<br>";
			label += "Amount: \u20B9" + am + "  (" + cu + ")<br>";
			label += "UPI ID: " + pa + "<br>";
			label += "Reference: " + reference + "<br>";
			document.getElementById("name").innerHTML = label;
			document.getElementById("opayIntent").href = upiURL;

			new QRious({
				element: document.getElementById('qr'),
				background: '#fff',
				foreground: '#000',
				size: 200,
				level: 'H',
				value: upiURL,
			});
		})();

		function payNow() {
			var qs = window.location.search;
			var params = new URLSearchParams(qs);
			var reference = params.get("reference") || "";
			var callback = window.location.protocol + "//" + window.location.hostname;
			if (window.location.port) callback += ":" + window.location.port;
			callback += "/callback?status=success&reference=" + encodeURIComponent(reference);
			location.href = "upi://pay" + qs
				+ "&refId=" + encodeURIComponent(reference)
				+ "&url=" + encodeURIComponent(callback);
		}
	</script>
</body>

</html>
