name: OPay tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - run: npm --prefix upipay test
      - run: node --test checkout/server.test.mjs
        working-directory: upipay
      - run: node --test checkout/server.test.mjs
        working-directory: upipay
        env:
          OPAY_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
