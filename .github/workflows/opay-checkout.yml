name: OPAY checkout tests
on:
  pull_request:
    paths:
      - 'upipay/**'
      - '.github/workflows/opay-checkout.yml'
  push:
    branches: [feature/upi-app-return-pending]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: upipay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: upipay/package-lock.json
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/checkout.integration.test.mjs
