name: OPAY checkout tests
on:
  pull_request:
    paths:
      - 'upipay/**'
      - '.github/workflows/opay-checkout.yml'
  push:
    branches: [feature/upi-app-return-pending]
permissions:
  contents: write
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: upipay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: upipay/package-lock.json
      - name: Refresh lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/upi-app-return-pending'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize upipay lockfile"
            git push
          fi
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/checkout.integration.test.mjs
